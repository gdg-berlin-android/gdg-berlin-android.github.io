<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google IO Extended - Buzzword Bingo</title>
    <link rel="stylesheet" href="buzz.css">
</head>
<body>
    <h1>Google IO Extended Buzzword Bingo</h1>
    <tt id="debug"/>

    <div class="bingo-grid" id="grid"></div>

    <div id="bingo-modal">
        <div class="modal-content">
            <h2 style="font-size: 3rem; color: #6c5ce7; margin: 0;">BINGO!</h2>
            <p>You've have a BINGO!</p>
	    <ul>
		<li>🏆Shout 'BINGO'🏆</li>
		<li>Go to the organizers</li>
		<li>Show this page and</li>
		<li>Get your prize (limited supply)</li>
	    </ul>
	    </p>
            <button onclick="closeModal()">Play Again</button>
        </div>
    </div>

    <!-- Include *optional* speech recognition support -->
    <p></p>
    <div class="controls" style="margin-bottom: 20px; display: flex; justify-content: center;">
        <button id="voiceBtn" class="btn-start" style="display: none; padding: 12px 24px; background-color: #6c5ce7; color: white; border: none; font-size: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;">🎤 Start Listening</button>
    </div>
    <div id="bingoBotLink" style="display: none; margin-top: 30px; margin-bottom: 20px; font-size: 0.9rem; color: #636e72; text-align: center;">
        Need a bot that plays bingo? Check out <a href="https://lucasrangit.github.io/BingoBot/" target="_blank" style="color: #6c5ce7; text-decoration: none; font-weight: bold;">BingoBot</a>.
    </div>
    <script src="https://lucasrangit.github.io/BingoBot/speech.js"></script>

    <script src="bingo.js"></script>
</body>
</html>
